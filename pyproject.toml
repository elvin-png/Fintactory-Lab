[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finfactor-lab"
version = "0.1.0"
description = "A small A-share daily market data analysis project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.14",
    "pandas>=2.0",
    "duckdb>=1.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
